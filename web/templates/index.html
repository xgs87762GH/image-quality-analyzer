{% extends "base.html" %}

{% block title %}图像列表 - Image Quality Analyzer{% endblock %}

{% block content %}
<!-- 页面头部：标题和操作按钮 -->
<div class="page-header">
    <h2 class="page-title">图像列表</h2>
    <div class="header-actions">
        <!-- 视图切换 -->
        <div class="view-toggle-group">
            <button class="btn btn-icon" id="gridViewBtn" onclick="switchView('grid')" title="宫格视图">
                <span>⊞</span>
            </button>
            <button class="btn btn-icon" id="listViewBtn" onclick="switchView('list')" title="列表视图">
                <span>☰</span>
            </button>
        </div>
        <!-- 主要操作按钮 -->
        <button class="btn btn-primary" onclick="analyzeImages()" id="analyzeBtn">
            <span>🔍</span> 分析图片
        </button>
        <button class="btn btn-warning" onclick="cleanupImages()" title="清理源文件不存在的图片记录">
            <span>🧹</span> 清理脏数据
        </button>
        <button class="btn btn-secondary" onclick="toggleSelectionMode()" id="selectionModeBtn">
            <span>✓</span> 选择模式
        </button>
        <button class="btn btn-info" onclick="toggleAdvancedSearch()" id="advancedSearchBtn">
            <span>🔎</span> 高级搜索
        </button>
        <!-- 批量操作栏（选择模式时显示） -->
        <div class="batch-actions" id="batchActions" style="display: none;">
            <span class="batch-count" id="batchCount">已选择 0 张</span>
            <button class="btn btn-warning" onclick="batchClearEvaluations()">
                <span>🗑️</span> 清理评估
            </button>
            <button class="btn btn-danger" onclick="batchDelete()">
                <span>🗑️</span> 批量删除
            </button>
        </div>
    </div>
</div>

<!-- 高级搜索面板 -->
<div class="advanced-search-panel" id="advancedSearchPanel" style="display: none;">
    <div class="search-panel-header">
        <h3>高级搜索</h3>
        <button class="btn-close" onclick="toggleAdvancedSearch()" title="关闭">×</button>
    </div>
    <div class="search-panel-body">
        <div class="search-row">
            <div class="search-group">
                <label>文件名</label>
                <input type="text" id="searchFileName" class="search-input" placeholder="搜索文件名...">
            </div>
            <div class="search-group">
                <label>文件路径</label>
                <input type="text" id="searchFilePath" class="search-input" placeholder="搜索文件路径...">
            </div>
            <div class="search-group">
                <label>元数据描述</label>
                <input type="text" id="searchDescription" class="search-input" placeholder="搜索EXIF、XMP、AI分析等...">
            </div>
        </div>
        <div class="search-row">
            <div class="search-group">
                <label>评估问题</label>
                <input type="text" id="searchEvaluationIssue" class="search-input" placeholder="搜索评估问题描述...">
            </div>
            <div class="search-group">
                <label>评估结果</label>
                <input type="text" id="searchEvaluationResult" class="search-input" placeholder="搜索评估结果...">
            </div>
            <div class="search-group">
                <label>质量分数范围</label>
                <div class="range-inputs">
                    <input type="number" id="searchQualityMin" class="range-input" placeholder="最小值" min="0" max="100" step="0.1">
                    <span>-</span>
                    <input type="number" id="searchQualityMax" class="range-input" placeholder="最大值" min="0" max="100" step="0.1">
                </div>
            </div>
        </div>
        <div class="search-row">
            <div class="search-group">
                <label>评级</label>
                <select id="searchRating" class="filter-select">
                    <option value="">全部</option>
                    <option value="5">5星</option>
                    <option value="4">4星</option>
                    <option value="3">3星</option>
                    <option value="2">2星</option>
                    <option value="1">1星</option>
                </select>
            </div>
            <div class="search-group">
                <label>标签</label>
                <select id="searchLabel" class="filter-select">
                    <option value="">全部</option>
                    <option value="HighQuality">高质量</option>
                    <option value="MediumQuality">中等质量</option>
                    <option value="LowQuality">低质量</option>
                    <option value="VeryLowQuality">极低质量</option>
                </select>
            </div>
            <div class="search-group">
                <label></label>
                <div class="search-actions">
                    <button class="btn btn-primary" onclick="performAdvancedSearch()">搜索</button>
                    <button class="btn btn-secondary" onclick="resetAdvancedSearch()">重置</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 简单搜索和筛选 -->
<div class="filters-bar">
    <div class="filters">
        <input type="text" id="searchInput" class="search-input" placeholder="搜索图像..." onkeyup="handleSearch()">
        <select id="labelFilter" class="filter-select" onchange="loadImages()">
            <option value="">所有标签</option>
            <option value="HighQuality">高质量</option>
            <option value="MediumQuality">中等质量</option>
            <option value="LowQuality">低质量</option>
        </select>
        <select id="ratingFilter" class="filter-select" onchange="loadImages()">
            <option value="">所有评级</option>
            <option value="5">5星</option>
            <option value="4">4星</option>
            <option value="3">3星</option>
            <option value="2">2星</option>
            <option value="1">1星</option>
        </select>
    </div>
</div>

<!-- 索引按钮容器（无图片时显示） -->
<div class="index-button-container" id="indexButtonContainer" style="display: none;">
    <div class="index-button-content">
        <div class="index-button-icon">📂</div>
        <div class="index-button-text">
            <h3>还没有图片</h3>
            <p>点击下方按钮开始索引图片到数据库</p>
            <button class="btn btn-primary btn-lg" onclick="indexImages()">
                <span>🔄</span> 索引图片
            </button>
        </div>
    </div>
</div>

<!-- 加载状态 -->
<div id="loading" class="loading" style="display: none;">加载中...</div>

<!-- 图像列表容器 -->
<div id="imageList" class="image-grid view-grid"></div>

<!-- 分页 -->
<div id="pagination" class="pagination"></div>
{% endblock %}

{% block extra_js %}
<!-- 注意：common.js 已在 base.html 中加载，无需重复加载 -->
<!-- 模块化脚本 -->
<script src="{{ url_for('static', filename='js/modules/state.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/api-service.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/image-card.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/settings-manager.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/selection-manager.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/view-manager.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/search-manager.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/image-list-manager.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/batch-operations.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/analysis-manager.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/index-manager.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/__init__.js') }}"></script>
{% endblock %}
